volumes:
  pg_data_production:
  static_volume:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
  backend:
    image: skrimax/taski_backend
    env_file: .env
    volumes:
      - static_volume:/backend_static
  frontend:
    image: skrimax/taski_frontend
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/frontend_static
  gateway:
    image: skrimax/taski_gateway
    env_file: .env
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/staticfiles
    ports:
      - 8000:80
    depends_on:
      - backend
