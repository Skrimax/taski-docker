services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - taski-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: skrimax/taski_backend
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn backend.wsgi:application --bind 0.0.0.0:8000"
    env_file: .env
    volumes:
      - static_volume:/backend_static
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taski-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: skrimax/taski_frontend
    command: sh -c "cp -r /app/build/. /frontend_build/ && cp -r /app/build/static/. /static/"
    volumes:
      - frontend_build:/frontend_build
      - static_volume:/static
    networks:
      - taski-net

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: skrimax/taski_gateway
    ports:
      - 8000:80
    volumes:
      #- ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/static
      #- frontend_build:/frontend_build
    depends_on:
      - backend
      - frontend
    networks:
      - taski-net

volumes:
  pg_data_production:
  static_volume:
  frontend_build:

networks:
  taski-net:
    driver: bridge
